name: read time sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only first; import explicitly after reviewing logs'
        type: choice
        options:
          - preview
          - import
        default: preview
        required: true
      year:
        description: 'Calendar year to restore; blank means current year'
        type: string
        default: ''
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      READ_TIME_MODE: ${{ inputs.mode }}
      READ_TIME_YEAR: ${{ inputs.year }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Reading time preview or import
        run: read_time
