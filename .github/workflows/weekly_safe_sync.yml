name: weekly safe WeRead sync

on:
  schedule:
    # Monday 05:17 Asia/Shanghai (Sunday 21:17 UTC).
    - cron: '17 21 * * 0'
  workflow_dispatch:

concurrency:
  group: weread-notion-sync
  cancel-in-progress: false

jobs:
  weekly:
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/fix/pro-2026-safe-sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      READ_TIME_MODE: import
      BOOK_PROGRESS_MODE: import
      BOOK_PROGRESS_OFFSET: '0'
      # Zero means every remaining shelf book; updates are monotonic and idempotent.
      BOOK_PROGRESS_LIMIT: '0'
    steps:
      - name: Checkout the triggering branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard branch and credentials
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Scheduled synchronization is allowed only on main"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/fix/pro-2026-safe-sync" ]]; then
            echo "::error::This workflow is not allowed on $GITHUB_REF"
            exit 1
          fi
          test -n "$NOTION_TOKEN" || { echo "::error::Missing NOTION_TOKEN"; exit 1; }
          test -n "$NOTION_PAGE" || { echo "::error::Missing NOTION_PAGE"; exit 1; }
          test -n "$WEREAD_API_KEY" || { echo "::error::Missing WEREAD_API_KEY"; exit 1; }
      - name: Install local repair package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Increment current-year daily reading time
        run: python -m weread2notionpro.read_time
      - name: Resolve current heatmap year
        shell: bash
        run: echo "HEATMAP_YEAR=$(TZ=Asia/Shanghai date +%Y)" >> "$GITHUB_ENV"
      - name: Render heatmap from preserved daily history
        run: python -m weread2notionpro.heatmap_sync --year "$HEATMAP_YEAR"
      - name: Commit changed heatmap only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "OUT_FOLDER/weread_${HEATMAP_YEAR}.svg"
          if git diff --cached --quiet; then
            echo "Heatmap SVG unchanged"
          else
            git commit -m "data: weekly WeRead heatmap ${HEATMAP_YEAR}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "HEATMAP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Point the existing Notion embed at the committed heatmap
        run: python -m weread2notionpro.heatmap_sync --year "$HEATMAP_YEAR" --update-embed
      - name: Increment cumulative time for every existing shelf book
        run: python -m weread2notionpro.book_progress_sync

