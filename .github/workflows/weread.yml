name: WeRead2Notion migration (manual only)

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: "I exported the old Notion data and selected a fresh copy of the official WeRead2Notion template"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weread2notion-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync after backup confirmation
    if: ${{ inputs.backup_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required Secrets without printing values
        shell: bash
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
        run: |
          missing=0
          for name in WEREAD_API_KEY NOTION_TOKEN NOTION_PAGE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Actions Secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: WeRead to Notion
        uses: malinkang/weread2notion@36daed3aa7fda67088f97fc23c03f63e418220c4
        with:
          weread-api-key: ${{ secrets.WEREAD_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page: ${{ secrets.NOTION_PAGE }}
